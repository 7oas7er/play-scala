# Path scope for Netrunner SAST. Full query suite comes from the workflow
# (`security-extended`). Document triage in docs/codeql.md.
name: netrunner-codeql

paths:
  - netrunner
  - .github/workflows

paths-ignore:
  - "**/*.md"
  - "**/package-lock.json"
  - "infra/terraform/**"
  - "tests/node_modules/**"
