name: Required CI

# Always runs on PRs to staging/main so branch rules can require one stable check.
# Path-filtered workflows (Deploy, Terraform plan, Dependency audit, CodeQL) still
# enforce their own jobs when those paths change — see docs/github-branch-protection.md.
on:
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Summarize path-filtered gates
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            site:
              - 'netrunner/**'
              - 'tests/**'
              - '.github/workflows/deploy-netrunner.yml'
            infra:
              - 'infra/terraform/**'
              - '.github/workflows/terraform-plan.yml'
            deps:
              - 'tests/package.json'
              - 'tests/package-lock.json'
              - '.github/workflows/dependency-audit.yml'
            codeql:
              - 'netrunner/**'
              - '.github/workflows/**'
              - '.github/codeql/**'

      - name: Gate map
        run: |
          set -euo pipefail
          echo "Expect these workflows when the matching paths change:"
          if [ "${{ steps.filter.outputs.site }}" = "true" ]; then
            echo "- Deploy Netrunner → Catalog tests"
          fi
          if [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
            echo "- Terraform plan → Format, IaC policy (Checkov), Validate/Plan"
          fi
          if [ "${{ steps.filter.outputs.deps }}" = "true" ]; then
            echo "- Dependency audit → npm audit (tests)"
          fi
          if [ "${{ steps.filter.outputs.codeql }}" = "true" ]; then
            echo "- CodeQL → Analyze (javascript-typescript / actions)"
          fi
          if [ "${{ steps.filter.outputs.site }}" != "true" ] \
            && [ "${{ steps.filter.outputs.infra }}" != "true" ] \
            && [ "${{ steps.filter.outputs.deps }}" != "true" ] \
            && [ "${{ steps.filter.outputs.codeql }}" != "true" ]; then
            echo "- Docs/meta-only PR: path-filtered suites intentionally skipped"
          fi
