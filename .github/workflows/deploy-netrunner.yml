name: Deploy Netrunner

# staging → staging AWS env; main → production AWS env.
# Tests must pass before deploy. Deploy roles trust only those branch refs via OIDC.
on:
  push:
    branches:
      - staging
      - main
    paths:
      - "netrunner/**"
      - "tests/**"
      - ".github/workflows/deploy-netrunner.yml"
  pull_request:
    branches:
      - staging
      - main
    paths:
      - "netrunner/**"
      - "tests/**"
      - ".github/workflows/deploy-netrunner.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-netrunner-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  # Cancel superseded PR test runs; never cancel in-progress push/deploy runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect site changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            site:
              - 'netrunner/**'
              - '.github/workflows/deploy-netrunner.yml'

  test:
    name: Catalog tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run unit and end-to-end tests
        run: npm test
        env:
          CI: true

  deploy:
    name: Publish to S3
    needs:
      - test
      - changes
    # Skip S3/CloudFront/Cloudflare when only tests/** changed. Manual runs always deploy.
    if: >
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.site == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check environment variables
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "Set AWS_DEPLOY_ROLE_ARN on the GitHub Environment to the Terraform github_deploy_role_arn output."
            exit 1
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "Set AWS_REGION on the GitHub Environment to the Terraform deploy_region output."
            exit 1
          fi
          if [ -z "${{ vars.AWS_SITE_BUCKET }}" ]; then
            echo "Set AWS_SITE_BUCKET on the GitHub Environment to the Terraform bucket_name output."
            exit 1
          fi
          if [ -z "${{ vars.AWS_DISTRIBUTION_ID }}" ]; then
            echo "Set AWS_DISTRIBUTION_ID on the GitHub Environment to the Terraform distribution_id output."
            exit 1
          fi
          if [ -z "${{ vars.SITE_HOST }}" ]; then
            echo "Set SITE_HOST on the GitHub Environment (e.g. netrunner-stg.7oas7er.com or netrunner.7oas7er.com)."
            exit 1
          fi
          if [ -z "${{ vars.CLOUDFLARE_ZONE_ID }}" ]; then
            echo "Set CLOUDFLARE_ZONE_ID on the GitHub Environment to the Cloudflare Terraform zone_id output."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Set CLOUDFLARE_API_TOKEN on the GitHub Environment (Zone.Cache Purge + Zone.Read)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: netrunner-${{ github.run_id }}

      - name: Sync the site to S3
        run: |
          set -euo pipefail
          # Origin Cache-Control; Cloudflare cache rules respect this (see infra/terraform/cloudflare/cache.tf).
          # HTML/JSON stays short-lived so new ?v= asset URLs show up quickly after deploy.
          # JS/CSS are versioned via ?v= in HTML — long immutable TTL is safe (bump ?v= when they change).
          bucket="s3://${{ vars.AWS_SITE_BUCKET }}"
          aws s3 sync netrunner "${bucket}" \
            --delete \
            --exclude "README.md" \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --exclude "*.js" \
            --exclude "*.css" \
            --cache-control "public, max-age=60, must-revalidate"
          aws s3 sync netrunner "${bucket}" \
            --exclude "*" \
            --include "*.js" \
            --include "*.css" \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Purge Cloudflare edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          set -euo pipefail
          mapfile -t paths < <(printf '%s\n' \
            "/" \
            "/index.html" \
            "/imprint.html" \
            "/data/catalog.json" \
            "/css/styles.css" \
            "/css/styles.css?v=1" \
            "/js/generators.js" \
            "/js/generators.js?v=1" \
            "/js/catalog.js" \
            "/js/catalog.js?v=1" \
            "/js/main.js" \
            "/js/main.js?v=1")
          files_json='['
          first=1
          for path in "${paths[@]}"; do
            if [ "$path" = "/" ]; then
              url="https://${SITE_HOST}/"
            else
              url="https://${SITE_HOST}${path}"
            fi
            if [ "$first" -eq 1 ]; then
              first=0
            else
              files_json+=','
            fi
            files_json+=$(printf '"%s"' "$url")
          done
          files_json+=']'
          response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\": ${files_json}}")"
          echo "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("success") else 1)'
          echo "Purged Cloudflare cache for ${SITE_HOST}"
